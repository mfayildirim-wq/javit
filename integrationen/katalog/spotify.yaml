id: spotify
name: Spotify
beschreibung: Musik auf Spotify suchen und abspielen, Wiedergabe steuern, Warteschlange und Playlists
kategorie: Musik
icon: music
art: eingebaut
eingebaut: spotify
benoetigt:
  - {name: SPOTIFY_CLIENT_ID, titel: Client ID, geheim: false}
  - {name: SPOTIFY_CLIENT_SECRET, titel: Client Secret, geheim: true}
  - {name: SPOTIFY_REFRESH_TOKEN, titel: "Refresh-Token (optional, über „jarvis spotify-anmelden“)", geheim: true, optional: true}
hinweis: "Unter developer.spotify.com/dashboard eine App anlegen (Web API), Redirect-URI http://127.0.0.1:8888/callback eintragen, Client ID und Secret kopieren. Ohne Anmeldung wird über die Spotify-App des Macs abgespielt; „jarvis spotify-anmelden“ schaltet Warteschlange, Playlists und Gerätesteuerung frei. Einfache Steuerung (Play/Pause/Weiter) klappt auch ohne Integration über das eingebaute Werkzeug musik_steuern."
webseite: https://developer.spotify.com/documentation/web-api
risiko_standard: aendern
