id: github-token
name: GitHub (mit Token)
beschreibung: GitHub-Server mit Personal Access Token statt Browser-Anmeldung
kategorie: Entwicklung
icon: github
art: mcp_http
url: https://api.githubcopilot.com/mcp/
kopfzeilen:
  Authorization: Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}
benoetigt:
- name: GITHUB_PERSONAL_ACCESS_TOKEN
  titel: Personal Access Token
  geheim: true
vertrauen: offiziell
quelle: https://docs.github.com/en/copilot/how-tos/context/use-mcp/use-the-github-mcp-server
hinweis: Token unter github.com › Settings › Developer settings › Personal access tokens (fine-grained) anlegen,
  nur benötigte Rechte vergeben.
webseite: https://github.com/github/github-mcp-server
risiko_standard: aendern
werkzeug_risiko:
  merge_pull_request: kritisch
  delete_file: kritisch
