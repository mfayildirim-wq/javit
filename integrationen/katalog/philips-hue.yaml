id: philips-hue
name: Philips Hue
beschreibung: Hue-Lampen und Räume schalten, dimmen und Szenen abfragen (lokale Bridge)
kategorie: Smart Home
icon: lightbulb
art: rest
benoetigt:
  - {name: HUE_BRIDGE_IP, titel: IP-Adresse der Bridge, geheim: false}
  - {name: HUE_BENUTZER, titel: Bridge-Benutzername (API-Schlüssel), geheim: true}
hinweis: "IP-Adresse in der Hue-App unter Einstellungen › Bridges. Benutzernamen erzeugen: Knopf auf der Bridge drücken, dann im Terminal: curl -X POST http://<IP>/api -d '{\"devicetype\":\"jarvis#mac\"}' – der Wert „username“ ist der Benutzername."
webseite: https://developers.meethue.com/develop/get-started-2/
risiko_standard: aendern
rest:
  - name: lichter_auflisten
    methode: GET
    url: http://${HUE_BRIDGE_IP}/api/${HUE_BENUTZER}/lights
    beschreibung: Listet alle Lampen mit ID, Name und Zustand.
  - name: raeume_auflisten
    methode: GET
    url: http://${HUE_BRIDGE_IP}/api/${HUE_BENUTZER}/groups
    beschreibung: Listet Räume/Zonen mit ID, Name und Lampen.
  - name: szenen_auflisten
    methode: GET
    url: http://${HUE_BRIDGE_IP}/api/${HUE_BENUTZER}/scenes
    beschreibung: Listet gespeicherte Szenen.
  - name: licht_schalten
    methode: PUT
    url: http://${HUE_BRIDGE_IP}/api/${HUE_BENUTZER}/lights/{licht_id}/state
    beschreibung: Schaltet/dimmt eine Lampe (on, bri 1–254, ct 153–500 Farbtemperatur, hue 0–65535, sat 0–254).
    parameter:
      licht_id: {typ: text, pflicht: true}
      "on": {typ: bool}
      bri: {typ: ganzzahl}
      ct: {typ: ganzzahl}
      hue: {typ: ganzzahl}
      sat: {typ: ganzzahl}
  - name: raum_schalten
    methode: PUT
    url: http://${HUE_BRIDGE_IP}/api/${HUE_BENUTZER}/groups/{raum_id}/action
    beschreibung: Schaltet/dimmt alle Lampen eines Raums oder aktiviert eine Szene (scene = Szenen-ID).
    parameter:
      raum_id: {typ: text, pflicht: true}
      "on": {typ: bool}
      bri: {typ: ganzzahl}
      ct: {typ: ganzzahl}
      scene: {typ: text}
