id: slack-lokal
name: Slack (lokal, mit Token)
beschreibung: Community-Server für Slack mit User-Token, läuft lokal per npx
kategorie: Kommunikation
icon: message-square
art: mcp_stdio
befehl: npx -y slack-mcp-server@latest --transport stdio
benoetigt:
- name: SLACK_MCP_XOXP_TOKEN
  titel: User-OAuth-Token (xoxp-…)
  geheim: true
- name: SLACK_MCP_ADD_MESSAGE_TOOL
  titel: Senden erlauben (true/false)
  geheim: false
  standard: 'true'
  optional: true
hinweis: Unter api.slack.com/apps eine App anlegen, User Token Scopes vergeben und den User OAuth Token (xoxp-…)
  kopieren. Alternative zum offiziellen Slack-Server.
webseite: https://github.com/korotovsky/slack-mcp-server
risiko_standard: aendern
werkzeug_risiko:
  conversations_add_message: kritisch
